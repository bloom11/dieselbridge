name: DieselBridge CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - develop
      - "setup/**"
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install persistent DieselBridge Bloom signing key
        env:
          DIESEL_DEV_KEYSTORE_B64: ${{ secrets.DIESEL_DEV_KEYSTORE_B64 }}
        run: |
          if [ -z "$DIESEL_DEV_KEYSTORE_B64" ]; then
            echo "::error::DIESEL_DEV_KEYSTORE_B64 is not configured"
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/diesel-dev-debug.keystore"

          printf '%s' "$DIESEL_DEV_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          EXPECTED_SHA256="62781110de7cdd6815210365399e90f9a1446837a9fa084be70bfedc90e6f7f5"

          ACTUAL_SHA256="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"

          echo "Bloom signing certificate: $ACTUAL_SHA256"

          if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "::error::Unexpected Bloom signing certificate"
            exit 1
          fi

          echo "DIESEL_DEV_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :watch:testDebugUnitTest :phone:testDebugUnitTest

      - name: Build debug APKs
        run: ./gradlew :watch:assembleDebug :phone:assembleDebug --stacktrace

      - name: Verify debug APK signing certificates
        run: |
          EXPECTED_SHA256="62781110de7cdd6815210365399e90f9a1446837a9fa084be70bfedc90e6f7f5"

          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n1)"

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found"
            exit 1
          fi

          for APK in watch/build/outputs/apk/debug/watch-debug.apk phone/build/outputs/apk/debug/phone-debug.apk
          do
            ACTUAL_SHA256="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n1 | tr '[:upper:]' '[:lower:]')"

            echo "$APK certificate: $ACTUAL_SHA256"

            if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "::error::$APK has unexpected signing certificate"
              exit 1
            fi
          done

      - name: Upload watch debug APK
        uses: actions/upload-artifact@v4
        with:
          # Keep this name stable for tools/diesel-ci-watch-install.
          name: dieselbridge-bloom-debug
          path: watch/build/outputs/apk/debug/watch-debug.apk
          retention-days: 14

      - name: Upload phone debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dieselbridge-phone-bloom-debug
          path: phone/build/outputs/apk/debug/phone-debug.apk
          retention-days: 14
