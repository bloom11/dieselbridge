name: DieselBridge CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - develop
      - "setup/**"
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :watch:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :watch:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dieselbridge-watch-debug
          path: watch/build/outputs/apk/debug/watch-debug.apk
          retention-days: 14
