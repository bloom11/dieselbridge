name: DieselBridge CI

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - develop
      - "setup/**"
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install persistent DieselBridge Bloom signing key
        env:
          DIESEL_DEV_KEYSTORE_B64: ${{ secrets.DIESEL_DEV_KEYSTORE_B64 }}
        run: |
          if [ -z "$DIESEL_DEV_KEYSTORE_B64" ]; then
            echo "::error::DIESEL_DEV_KEYSTORE_B64 is not configured"
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$DIESEL_DEV_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew :watch:testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew :watch:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dieselbridge-bloom-debug
          path: watch/build/outputs/apk/debug/watch-debug.apk
          retention-days: 14
